<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学部祭典実行委員会サイト テンプレート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">

<style>
/* 配色は色相 --h・彩度係数 --k・主色の彩度 --ps と明度 --pl で決まる。下のトークンはすべてそこから算出 */
:root{
  --h:265; --k:1; --ps:48%; --pl:42%;
  --p:hsl(var(--h) var(--ps) var(--pl)); --pd:hsl(var(--h) calc(45% * var(--k)) 28%);
  --pc:hsl(var(--h) calc(90% * var(--k)) 93%); --opc:hsl(var(--h) calc(80% * var(--k)) 16%); --pt:hsl(var(--h) calc(85% * var(--k)) 86%);
  --s:hsl(var(--h) calc(100% * var(--k)) 98.5%); --sl:hsl(var(--h) calc(40% * var(--k)) 96.5%); --sc:hsl(var(--h) calc(35% * var(--k)) 95%); --sh:hsl(var(--h) calc(28% * var(--k)) 92.5%);
  --sec:hsl(var(--h) calc(55% * var(--k)) 91%); --ov:hsl(var(--h) calc(14% * var(--k)) 79%); --o:hsl(var(--h) calc(5% * var(--k)) 47%);
  --on:hsl(var(--h) calc(10% * var(--k)) 12%); --onv:hsl(var(--h) calc(7% * var(--k)) 29%);
  --tc:hsl(calc(var(--h) + 75) calc(90% * var(--k)) 92%); --t:hsl(calc(var(--h) + 75) calc(25% * var(--k)) 38%); --tt:hsl(calc(var(--h) + 75) calc(90% * var(--k)) 85%);
}
html,body{margin:0;padding:0;background:var(--s);color:var(--on);font-family:"Google Sans","Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--tt);color:var(--on)}
a{color:var(--p);text-decoration:none}
a:hover{color:var(--opc);text-decoration:underline}
button{appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;-webkit-font-feature-settings:"liga";font-feature-settings:"liga"}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms !important}}
</style>
